<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SAMARTH INSTITUTE OF PHARMACY</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fbf7f2;color:#5a3a22;font-family:Georgia,"Times New Roman",serif}
.wrap{max-width:760px;margin:auto;padding:14px}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 30px #0001;margin-bottom:16px}
h1{font-size:22px;margin:0 0 4px;color:#8B5A2B;letter-spacing:.2px}
p{margin:4px 0 14px;color:#8B6A4A}
.poster-card{padding:12px}.poster-title{font-weight:800;color:#8B5A2B;font-size:18px;margin:2px 4px 10px}
#poster{width:100%;height:auto;border-radius:14px;display:block;background:#fff}
label{display:block;font-weight:700;margin:14px 0 7px}
input[type="text"],input[type="file"]{width:100%;padding:12px;border:1px solid #d8c5b2;border-radius:10px;font:inherit;background:#fff}#mobile{white-space:nowrap;overflow:hidden;text-overflow:clip;font-variant-numeric:tabular-nums}
input[type="file"]{padding:9px}
.controls{margin-top:12px;padding:13px;border:1px solid #dfcdbb;border-radius:14px;background:#fcf8f4}
.control-row{display:grid;grid-template-columns:90px 1fr 44px;gap:9px;align-items:center;margin:9px 0}
.control-row span{font-weight:700;font-size:14px}
input[type="range"]{width:100%;accent-color:#8B5A2B}
.val{font-size:13px;color:#8B6A4A;text-align:right}
.hint{font-size:12px;line-height:1.45;color:#7a6756;margin-top:8px}
.move-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.move-btn{margin:0;padding:10px;font-size:14px;background:#8B5A2B}.move-btn:active{transform:translateY(1px)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#8B5A2B;color:white;font-size:16px;font-weight:700;margin-top:16px;cursor:pointer}
button.secondary{background:#f1e5d9;color:#6f492c}
button:active{transform:scale(.99)}
.photo-status{font-size:13px;color:#8B5A2B;margin-top:7px}
@media(max-width:480px){
 .wrap{padding:10px}
 .card{padding:14px;border-radius:18px}
 h1{font-size:20px}
 .control-row{grid-template-columns:78px 1fr 42px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="card poster-card">
    <canvas id="poster" width="1285" height="2047"></canvas>
  </div>

  <div class="card">
    <h1>SAMARTH INSTITUTE OF PHARMACY</h1>
    <p>PHARMA AI-NOVA NATIONAL CONFERENCE</p>

    <label for="photo">1. Upload Photo</label>
    <input id="photo" type="file" accept="image/jpeg,image/png,image/webp">
    <div id="photoStatus" class="photo-status">Choose a photo to place it inside the portrait photo frame.</div>

    <div class="controls">
      <strong>Adjust Photo Inside Frame</strong>
      <div class="control-row">
        <span>↔ Horizontal</span>
        <input id="posX" type="range" min="-100" max="100" value="0">
        <span id="posXVal" class="val">0</span>
      </div>
      <div class="move-row">
        <button type="button" class="move-btn" id="moveLeft">← Move Left</button>
        <button type="button" class="move-btn" id="moveRight">Move Right →</button>
      </div>
      <div class="control-row">
        <span>↕ Vertical</span>
        <input id="posY" type="range" min="-100" max="100" value="0">
        <span id="posYVal" class="val">0</span>
      </div>
      <div class="move-row">
        <button type="button" class="move-btn" id="moveUp">↑ Move Up</button>
        <button type="button" class="move-btn" id="moveDown">Move Down ↓</button>
      </div>
      <div class="control-row">
        <span>🔍 Zoom</span>
        <input id="zoom" type="range" min="50" max="250" value="100">
        <span id="zoomVal" class="val">100%</span>
      </div>
      <div class="move-row">
        <button type="button" class="move-btn" id="zoomOut">− Zoom Out</button>
        <button type="button" class="move-btn" id="zoomIn">+ Zoom In</button>
      </div>
      <div class="hint">You can also drag the photo directly on the poster after uploading.</div>
    </div>

    <label for="regNo">2. Participant ID</label>
    <input id="regNo" type="text" placeholder="Enter participant ID" autocomplete="off">

    <label for="name">3. Name of Participant</label>
    <input id="name" type="text" placeholder="Your name" autocomplete="name">

    <label for="designation">4. College Name</label>
    <input id="designation" type="text" placeholder="Enter college name">

    <label for="mobile">5. Mobile Number</label>
    <input id="mobile" type="text" inputmode="numeric" placeholder="Enter mobile number" maxlength="10" autocomplete="tel">

    <div class="btns">
      <button id="download">↓ Download Poster PNG</button>
      <button class="secondary" id="reset">Reset</button>
    </div>
  </div>

</div>

const FRAME = {x:478,y:944,w:330,h:372,r:34}; // matches the poster portrait frame

function loadImage(src){
  return new Promise((resolve,reject)=>{
    const im=new Image();
    im.onload=()=>resolve(im);
    im.onerror=reject;
    im.src=src;
  });
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function clamp(v,min,max){return Math.max(min,Math.min(max,v));}

function fitPhoto(){
  if(!photoImage) return null;
  const zoom=Number(zoomInput.value)/100;
  const scale=Math.max(FRAME.w/photoImage.width,FRAME.h/photoImage.height)*zoom;
  const nw=photoImage.width*scale;
  const nh=photoImage.height*scale;

  // Slider values are percentages of the extra image area.
  const extraX=Math.max(0,nw-FRAME.w);
  const extraY=Math.max(0,nh-FRAME.h);
  const px=(Number(posXInput.value)/100)*(extraX/2);
  const py=(Number(posYInput.value)/100)*(extraY/2);

  return {nw,nh,x:FRAME.x+(FRAME.w-nw)/2+px,y:FRAME.y+(FRAME.h-nh)/2+py};
}

function fitText(text,maxWidth,startSize,minSize=12,weight="bold"){
  let size=startSize;
  while(size>minSize){
    ctx.font=`${weight} ${size}px Georgia`;
    if(ctx.measureText(text).width<=maxWidth) break;
    size-=1;
  }
  return size;
}

    ctx.save();
    roundRect(FRAME.x+3,FRAME.y+3,FRAME.w-6,FRAME.h-6,FRAME.r);
    ctx.clip();
    ctx.drawImage(photoImage,p.x,p.y,p.nw,p.nh);
    ctx.restore();

  } else {
  }

  const regNo=(regNoInput.value||"").trim();
  const name=(nameInput.value||"").trim();
  const designation=(designationInput.value||"").trim();
  const mobile=(mobileInput.value||"").trim();

  ctx.textAlign="left";
  ctx.textBaseline="middle";
  ctx.fillStyle="#303030";

  // Write participant details in a larger, bold font on the printed lines.
  // Participant ID is placed after its label; the remaining values sit on their lines.
  if(regNo){
    const idText=regNo.replace(/[\r\n\t]+/g," ").replace(/\s+/g," ").trim();
    const idWidth=500;
    ctx.font="bold 44px Georgia";
    ctx.fillText(idText,375,1545);
  }
  if(name){
    const nameText=name.replace(/[\r\n\t]+/g," ").replace(/\s+/g," ").trim();
    const nameWidth=920;
    ctx.font="bold 44px Georgia";
    ctx.fillText(nameText,220,1637);
  }
  if(designation){
    const collegeText=designation.replace(/[\r\n\t]+/g," ").replace(/\s+/g," ").trim();
    const collegeWidth=820;
    ctx.font="bold 44px Georgia";
    ctx.fillText(collegeText,365,1717);
  }
  if(mobile){
    // Strip spaces and punctuation so the complete phone number is always one continuous line.
    const mobileText=mobile.replace(/\D/g,"").slice(0,10);
    const mobileWidth=560;
    ctx.font="bold 44px Georgia";
    ctx.textAlign="left";
    ctx.fillText(mobileText,285,1792);
  }

}

function updateLabels(){
  posXVal.textContent=posXInput.value;
  posYVal.textContent=posYInput.value;
  zoomVal.textContent=zoomInput.value+"%";
}

photoInput.addEventListener("change",async e=>{
  const f=e.target.files[0];
  if(!f) return;
  photoStatus.textContent="Loading photo…";
  const r=new FileReader();
  r.onload=async()=>{
    photoData=r.result;
    photoImage=await loadImage(photoData);
    posXInput.value=0;
    posYInput.value=0;
    zoomInput.value=100;
    updateLabels();
    photoStatus.textContent="Photo added. Use the controls or drag the photo inside the square frame.";
    draw();
  };
  r.readAsDataURL(f);
});

[posXInput,posYInput,zoomInput].forEach(el=>{
  el.addEventListener("input",()=>{updateLabels();draw();});
});
[regNoInput,nameInput,designationInput].forEach(el=>el.addEventListener("input",draw));
mobileInput.addEventListener("input",()=>{
  const digits=mobileInput.value.replace(/\D/g,"").slice(0,10);
  if(mobileInput.value!==digits) mobileInput.value=digits;
  draw();
});

function movePhotoHorizontally(amount){
  if(!photoImage) return;
  posXInput.value=clamp(Number(posXInput.value)+amount,-100,100);
  updateLabels();
  draw();
}
moveLeft.addEventListener("click",()=>movePhotoHorizontally(-5));
moveRight.addEventListener("click",()=>movePhotoHorizontally(5));

function movePhotoVertically(amount){
  if(!photoImage) return;
  posYInput.value=clamp(Number(posYInput.value)+amount,-100,100);
  updateLabels();
  draw();
}
moveUp.addEventListener("click",()=>movePhotoVertically(-5));
moveDown.addEventListener("click",()=>movePhotoVertically(5));

function changeZoom(amount){
  if(!photoImage) return;
  zoomInput.value=clamp(Number(zoomInput.value)+amount,50,250);
  updateLabels();
  draw();
}
zoomOut.addEventListener("click",()=>changeZoom(-10));
zoomIn.addEventListener("click",()=>changeZoom(10));

// Drag the photo directly inside the frame.
canvas.addEventListener("pointerdown",e=>{
  if(!photoImage) return;
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(canvas.width/rect.width);
  const y=(e.clientY-rect.top)*(canvas.height/rect.height);
  if(x>=FRAME.x && x<=FRAME.x+FRAME.w && y>=FRAME.y && y<=FRAME.y+FRAME.h){
    dragging=true;
    canvas.setPointerCapture(e.pointerId);
    dragStart={x,y,px:Number(posXInput.value),py:Number(posYInput.value)};
  }
});
canvas.addEventListener("pointermove",e=>{
  if(!dragging) return;
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(canvas.width/rect.width);
  const y=(e.clientY-rect.top)*(canvas.height/rect.height);
  const p=fitPhoto();
  if(!p) return;
  const extraX=Math.max(1,p.nw-FRAME.w);
  const extraY=Math.max(1,p.nh-FRAME.h);
  const dx=x-dragStart.x;
  const dy=y-dragStart.y;
  posXInput.value=clamp(dragStart.px+(dx/(extraX/2))*100,-100,100);
  posYInput.value=clamp(dragStart.py+(dy/(extraY/2))*100,-100,100);
  updateLabels();
  draw();
});
canvas.addEventListener("pointerup",()=>dragging=false);
canvas.addEventListener("pointerleave",()=>dragging=false);
canvas.addEventListener("pointercancel",()=>dragging=false);

document.getElementById("download").addEventListener("click",async()=>{
  await draw();
  const a=document.createElement("a");
  a.download="SAMARTH INSTITUTE OF PHARMACY.png";
  a.href=canvas.toDataURL("image/png");
  a.click();
});

document.getElementById("reset").addEventListener("click",()=>{
  photoInput.value="";
  regNoInput.value="";
  nameInput.value="";
  designationInput.value="";
  mobileInput.value="";
  photoData=null;
  photoImage=null;
  posXInput.value=0;
  posYInput.value=0;
  zoomInput.value=100;
  updateLabels();
  photoStatus.textContent="Choose a photo to place it inside the portrait photo frame.";
  draw();
});

updateLabels();
draw();
</script>
</body>
</html>
